name: Notify Sonar on Source Connector Version Change

on:
  workflow_run:
    workflows: ["Publish Connectors"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  notify-version-change:
    name: Detect version changes and notify Sonar
    # A publish matrix can partially succeed. Dispatch any manifests that
    # successful matrix legs emitted, even if another connector failed.
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Get published source connector version changes
        id: published-source-changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          # Download manifests uploaded by successful publish matrix jobs.
          # Using the REST API directly because
          # actions/download-artifact@v4 has a known bug where run-id is
          # silently ignored (https://github.com/actions/download-artifact/issues/295).
          ARTIFACT_IDS=$(gh api "repos/$REPO/actions/runs/$WORKFLOW_RUN_ID/artifacts" \
            --paginate \
            --jq '.artifacts[] | select(.name | startswith("published-source-")) | .id')

          if [[ -z "$ARTIFACT_IDS" ]]; then
            echo "No published-source artifacts found."
            echo "changes=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p ./published-sources
          while IFS= read -r ARTIFACT_ID; do
            if [[ -z "$ARTIFACT_ID" ]]; then
              continue
            fi

            gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" > "/tmp/artifact-${ARTIFACT_ID}.zip"
            unzip -o "/tmp/artifact-${ARTIFACT_ID}.zip" -d ./published-sources/
            rm -f "/tmp/artifact-${ARTIFACT_ID}.zip"
          done <<< "$ARTIFACT_IDS"

          if ! compgen -G "./published-sources/*.json" > /dev/null; then
            echo "No published-source manifest files found after artifact download."
            echo "changes=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGES=$(jq -sc '[.[] | {connector, version}]' ./published-sources/*.json)
          echo "Published source connector version changes: $CHANGES"
          echo "changes=$CHANGES" >> "$GITHUB_OUTPUT"

      - name: Authenticate as GitHub App
        if: fromJSON(steps.published-source-changes.outputs.changes)[0] != null
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        id: get-app-token
        with:
          owner: "airbytehq"
          repositories: "sonar"
          app-id: ${{ secrets.OCTAVIA_BOT_APP_ID }}
          private-key: ${{ secrets.OCTAVIA_BOT_PRIVATE_KEY }}

      - name: Dispatch to Sonar
        if: fromJSON(steps.published-source-changes.outputs.changes)[0] != null
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
          CHANGES: ${{ steps.published-source-changes.outputs.changes }}
        run: |
          set -euo pipefail

          echo "Dispatching to airbytehq/sonar with changes: $CHANGES"

          jq -n --argjson changes "$CHANGES" \
            '{"event_type": "replication-version-changed", "client_payload": {"changes": $changes}}' \
          | gh api repos/airbytehq/sonar/dispatches --method POST --input -
